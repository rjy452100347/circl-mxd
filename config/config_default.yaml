bot:
  mode: normal # Options: "normal" "aux" "patrol" "fixed_platform" "continuous_attack"
  attack: directional # Options: "directional" "aoe_skill"
  route_attack: false
  map: ''
key:
  aoe_skill: q
  directional_attack: w
  teleport: e
  jump: space
  add_hp: '1'
  add_mp: '2'
  return_home: home
directional_attack:
  range_x: 350
  range_y: 70
  cooldown: 0.9
  character_turn_delay: 0.02
aoe_skill:
  range_x: 400
  range_y: 170
  cooldown: 0.05
health_monitor:
  auto_hp_enabled: true
  auto_mp_enabled: true
  force_heal: false
  add_hp_percent: 50
  add_mp_percent: 50
  add_hp_cooldown: 0.5
  add_mp_cooldown: 0.5
  fps_limit: 20
  return_home_if_no_potion: false
  return_home_watch_dog_timeout: 3
teleport:
  is_use_teleport_to_walk: false
  cooldown: 1
edge_teleport:
  enable: true
  trigger_box_width: 20
  trigger_box_height: 10
  color_code: [255, 127, 127]
nametag:
  name: classic_cn_player
  # 0 searches the complete game frame, independently of the bottom health UI.
  search_y_limit: 0
monster_detect:
  openvino_deployment_root: deployment/openvino_cpu_2class
  yolo_variant: int8_v2 # Options: "int8_v2" "int8_head_fp"
  yolo_view_crop: [0, 0, 0, 0] # Three-class [left, top, right, bottom] in game-frame pixels
  yolo_content_scale: 1.0 # Three-class content size inside 1280x736 network input
  yolo_confidence: 0.60
  yolo_self_confidence: 0.50 # Three-class self localization threshold
  yolo_player_confidence: 0.25 # Three-class other-player threshold
  yolo_min_monster_box_side: 10 # px; 0 disables small-box filtering
  yolo_player_exclusion_width: 80 # px; 0 disables player-area filtering
  yolo_player_exclusion_height: 100 # px; 0 disables player-area filtering
  yolo_max_det: 50
combat_tracking:
  pursuit_vertical_tolerance: 70
  target_lost_grace_seconds: 0.3
channel_change:
  enable: false
  mode: pixel # Options: "true" "pixel"
  other_player_move_thres: 10
scheduled_channel_switching:
  enable: false
  interval_seconds: 1800
ui_coords:
  ui_y_start: 610
  menu: [1140, 730]
  channel: [1140, 666]
  random_channel: [877, 161]
  random_channel_confirm: [585, 420]
  select_character: [888, 275]
  login_button_thres: 0.05
  login_button_top_left: [838, 317]
  login_button_bottom_right: [940, 373]
route:
  search_range: 10
  jump_down_cooldown: 3.0
  traversal_commit_seconds: 0.45
  mount_horizontal_tolerance: 6
  mount_precision_tolerance: 1
  mount_settle_frames: 2
  mount_forward_hold_frames: 4
  mount_retry_runup_distance: 8
  mount_attempt_timeout: 1.5
  mount_confirm_frames: 3
  mount_max_attempts: 5
  mount_retry_frames: 5
  mount_success_distance: 12
  ladder_record_combo_seconds: 0.6
  ladder_record_timeout_seconds: 1.8
  ladder_record_success_distance: 12
  ladder_record_confirm_frames: 3
  color_code:
    "255,0,0": "left none none"
    "0,0,255": "right none none"
    "255,127,0": "left none jump"
    "0,255,255": "right none jump"
    "127,255,0": "none down jump"
    "255,0,255": "none none jump"
    "0,255,127": "stop stop stop"
    "255,255,0": "none none goal"
    "255,0,127": "none up teleport"
    "127,0,255": "none down teleport"
    "0,127,0": "left none teleport"
    "139,69,19": "right none teleport"
  color_code_up_down:
    "127,127,127": "none up none"
    "255,255,127": "none down none"
watchdog:
  range: 10
  timeout: 10
  last_attack_timeout: 1200
  last_attack_timeout_action: change_channel # Options: "go_home" "change_channel"
minimap:
  player_color: [136, 255, 255]
  other_player_color: [0, 0, 255]
  debug_window_upscale: 4
  offset: [0, 0]
patrol:
  range: [0.2, 0.8]
  turn_point_thres: 10
  patrol_attack_interval: 2.5
fixed_platform:
  width_px: 80
game_window:
  title: MapleStory Worlds
  size: [693, 1282]
  ratio_tolerance: 0.08
  title_bar_height: 59
profiler:
  enable: false
  print_frequency: 30
